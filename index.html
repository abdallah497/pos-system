<style>
:root{--bg:#0b1120;--sb:#0f172a;--c:rgba(30,41,59,.6);--bd:rgba(148,163,184,.18);--tx:#e2e8f0;--mu:#94a3b8;--pr:#38bdf8;--pr2:#818cf8;--ok:#34d399;--dn:#f87171}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 450px at 85% -10%,#1e3a5f66,transparent),var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;min-height:100vh}

.bt{margin-top:auto;border-top:1px solid var(--bd);padding-top:10px}

.it{display:flex;flex-direction:column;gap:3px;text-align:right;background:#0b1220;border:1px solid var(--bd);border-radius:10px;padding:10px;color:var(--tx);transition:.2s}

.al .ic{color:var(--dn);animation:sk 1.6s infinite}@keyframes sk{0%,80%,100%{transform:none}85%{transform:rotate(-14deg)}90%{transform:rotate(14deg)}95%{transform:rotate(-8deg)}}

.mk b:nth-child(2){animation-delay:-4s}.mk b:nth-child(3){animation-delay:-2s}
@keyframes fl{0%,30%{box-shadow:0 0 0 3px var(--pr);color:var(--tx);border:1px solid var(--pr);background:#38bdf81a}33%,100%{box-shadow:none}}
.cu{position:absolute;width:24px;height:24px;margin:-4px 0 0 -4px;color:var(--tx);animation:cur 6s infinite;filter:drop-shadow(0 2px 3px #0009);z-index:2}.cu .ic{width:24px;height:24px}
@keyframes cur{0%,30%{left:var(--x1);top:var(--y1)}33%,63%{left:var(--x2);top:var(--y2)}66%,96%{left:var(--x3);top:var(--y3)}100%{left:var(--x1);top:var(--y1)}}
.sl{list-style:none;padding:0;margin:0;counter-reset:s}
.sl li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;margin-bottom:4px;border-radius:10px;border:1px solid transparent;cursor:pointer;opacity:.65;line-height:1.7}
.sl li:before{counter-increment:s;content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--pr);color:#06202e;display:grid;place-items:center;font-size:12px;font-weight:700}
.sl li.on{opacity:1;background:#38bdf814;border-color:var(--pr)}
#tr{position:fixed;inset:0;z-index:60}
#sp{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px #000b;pointer-events:none;transition:all .35s;outline:3px solid var(--pr);animation:rg 1.4s infinite}
@keyframes rg{50%{outline-offset:6px;outline-color:#38bdf866}}
#tp{position:fixed;width:min(330px,92vw);background:var(--sb);border:1px solid var(--pr);border-radius:14px;padding:14px;box-shadow:0 10px 30px #000a;animation:pop .25s}
#tp .ic{animation:bn 1s infinite}@keyframes bn{50%{transform:translate(-4px,4px)}}
#rc{display:none}
@media print{body>*:not(#rc){display:none!important}#rc{display:block;color:#000;background:#fff;padding:8px;width:80mm;font-size:12px}#rc table{width:100%}#rc td,#rc th{border:0;padding:2px;white-space:normal}}

const idbOpen=()=>new Promise((ok,no)=>{const q=indexedDB.open("pcshop-db",1);q.onupgradeneeded=()=>q.result.createObjectStore("kv");q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});
const idbAll=()=>new Promise((ok,no)=>{const t=IDB.transaction("kv"),o={},c=t.objectStore("kv").openCursor();c.onsuccess=()=>{const x=c.result;if(x){o[x.key]=x.value;x.continue()}};t.oncomplete=()=>ok(o);t.onerror=()=>no(t.error)});
const idbGet=k=>new Promise(ok=>{try{const q=IDB.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null)}catch(e){ok(null)}});
const idbPut=(k,v)=>new Promise(ok=>{try{const t=IDB.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=()=>ok(true);t.onerror=()=>ok(false)}catch(e){ok(false)}});
const commit=()=>new Promise(ok=>{if(!IDB)return ok(false);try{const t=IDB.transaction("kv","readwrite"),st=t.objectStore("kv"),ch=[];
 [...COLS,...META].forEach(k=>{const v=JSON.stringify(D[k]);if(LAST[k]!==v){st.put(D[k],k);ch.push([k,v])}});
 t.oncomplete=()=>{ch.forEach(([k,v])=>LAST[k]=v);ok(true)};t.onerror=t.onabort=()=>{setSt("⚠️ تعذّر الحفظ");ok(false)}}catch(e){ok(false)}});
const flush=()=>{PEND=false;commit()};
const save=()=>{if(IDB){PEND=true;clearTimeout(DT);DT=setTimeout(flush,250)}else{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}};
const flushNow=()=>{if(PEND){clearTimeout(DT);flush()}};
addEventListener("pagehide",flushNow);document.addEventListener("visibilitychange",()=>{if(document.hidden)flushNow()});
async function dbInit(){
 let old=null;try{old=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 try{
  IDB=await idbOpen();const o=await idbAll(),has=!!o.inv;
  if(has){D=Object.assign(demo(),o);delete D.snap}else D=old&&old.inv?Object.assign(demo(),old):demo();
  if(has)[...COLS,...META].forEach(k=>LAST[k]=JSON.stringify(D[k]));
  else{const ok=await commit();if(ok&&old){try{localStorage.removeItem(KEY)}catch(e){}}}
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
 }catch(e){IDB=null;if(old&&old.inv)D=Object.assign(demo(),old)}
}
